<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maliearn AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --gold:#C9A227; --gold-dark:#A67C00; --gold-soft:#F6EBC4; --gold-faint:#FBF4DC;
  --bg:#FBF7EA; --card:#FFFDF7; --sidebar:#F4EDD6; --text:#2B2410; --muted:#8A7F5E;
  --border:#E8DFC0; --code-bg:#1E1B14; --code-head:#2C2819; --user:#F3E7B8; --sw:280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
/* Sidebar */
#sidebar{width:var(--sw);background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;flex:none;z-index:30;transition:transform .25s}
#newChat{background:var(--gold);color:#fff;font-weight:600;padding:11px 14px;border-radius:12px;display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px}
#newChat:hover{background:var(--gold-dark)}
.side-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 6px 8px}
#chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.chat-item{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;font-size:13.5px;cursor:pointer}
.chat-item:hover{background:var(--gold-faint)}
.chat-item.active{background:var(--gold-soft);font-weight:600}
.chat-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .del{opacity:.5;font-size:12px;padding:4px}
.chat-item .del:hover{opacity:1;color:#c0392b}
.side-foot{font-size:12px;color:var(--muted);padding:10px 6px 0;border-top:1px solid var(--border);margin-top:10px}
.side-foot a{color:var(--gold-dark);font-weight:600;text-decoration:none}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
/* Main */
#main{flex:1;display:flex;flex-direction:column;height:100dvh;min-width:0}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(255,253,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
#menuBtn{display:none;font-size:20px;padding:6px 8px;color:var(--gold-dark)}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none;background:var(--gold-soft)}
.fallback{display:flex;align-items:center;justify-content:center;background:var(--gold);color:#fff;font-weight:800;border-radius:50%;flex:none}
.brand{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.status i{width:8px;height:8px;border-radius:50%;background:#2ecc71;display:inline-block}
#chat{flex:1;overflow-y:auto;padding:20px 16px;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto}
/* Welcome */
#welcome{text-align:center;padding:30px 0}
#welcome .big{width:110px;height:110px;border-width:3px;margin:0 auto 16px;display:block;font-size:48px;box-shadow:0 8px 30px rgba(201,162,39,.35)}
#welcome h1{font-size:26px;font-weight:800;margin-bottom:8px}
#welcome p{color:var(--muted);max-width:480px;margin:0 auto 24px;font-size:15px;line-height:1.5}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:left;font-size:14px;line-height:1.4;transition:.15s}
.card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 6px 16px rgba(201,162,39,.18)}
.card i{color:var(--gold);display:block;margin-bottom:6px;font-size:16px}
/* Messages */
.msg{display:flex;gap:10px;margin-bottom:18px}
.msg.user{justify-content:flex-end}
.msg .avatar,.msg .fallback{width:34px;height:34px;font-size:15px;margin-top:2px}
.body{max-width:calc(100% - 50px);min-width:0}
.bubble{line-height:1.6;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--user);padding:10px 15px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;max-width:560px}
.msg.ai .bubble{padding:4px 0}
.msg.err .bubble{color:#a93226;background:#fdecea;padding:10px 14px;border-radius:12px}
.bubble p{margin-bottom:8px}.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{margin:12px 0 6px;font-size:17px}
.bubble ul,.bubble ol{margin:6px 0 8px 22px}
.bubble a{color:var(--gold-dark);font-weight:600}
.bubble code{background:var(--gold-soft);padding:2px 6px;border-radius:5px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.code{background:var(--code-bg);border-radius:12px;margin:10px 0;overflow:hidden}
.code-h{display:flex;justify-content:space-between;align-items:center;background:var(--code-head);color:#cfc6a3;padding:7px 12px;font-size:12px}
.code-h button{color:var(--gold);font-size:12px;font-weight:600}
.code pre{padding:12px;overflow-x:auto}
.code pre code{background:none;color:#f1ead0;padding:0;font-size:13px;white-space:pre}
.actions{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:13px;color:var(--muted)}
.actions button{font-size:14px;color:var(--muted);padding:3px}
.actions button:hover{color:var(--gold-dark)}
.actions button.on{color:var(--gold-dark)}
.actions .time{font-size:12px}
.typing{display:flex;gap:5px;padding:12px 0}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:b 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
/* Input */
#inputArea{padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:24px;padding:8px 8px 8px 16px}
.box:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
#input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:15px;resize:none;max-height:160px;padding:7px 0;color:var(--text);line-height:1.4}
#send{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;font-size:15px;flex:none}
#send:disabled{background:var(--border);cursor:not-allowed}
.note{text-align:center;font-size:11.5px;color:var(--muted);margin-top:7px}
@media(max-width:800px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}
  body.open #sidebar{transform:none}
  body.open #overlay{display:block}
  #menuBtn{display:block}
  .cards{grid-template-columns:1fr}
  .brand{font-size:20px}
}
</style>
</head>
<body>
<aside id="sidebar">
  <button id="newChat"><i class="fa-solid fa-plus"></i> New chat</button>
  <div class="side-title">Recent chats</div>
  <div id="chatList"></div>
  <div class="side-foot">By Ristatech · <a href="http://maliearnagencies.com" target="_blank" rel="noopener">Maliearn Agencies</a></div>
</aside>
<div id="overlay"></div>
<div id="main">
  <header id="topbar">
    <button id="menuBtn" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
    <div id="topAvatar"></div>
    <div><div class="brand">Maliearn AI</div><div class="status"><i></i> Online</div></div>
  </header>
  <div id="chat"><div class="wrap" id="wrap"></div></div>
  <div id="inputArea">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Ask me anything, bro..."></textarea>
      <button id="send" disabled aria-label="Send"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
    <div class="note">Maliearn AI can make mistakes.</div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
